---
# present: install and run Pacemaker (and SBD) on a running Corosync cluster; absent: stop, purge, remove CIB and config
pacemaker_state: present

# Extra packages, e.g. resource agents or fence agents
pacemaker_packages_extra: []

# pcsd rewrites corosync.conf and listens on TCP 2224: masked; false leaves it as its package set it
pacemaker_pcsd_masked: true
# openipmi.service (installed through ipmitool's Recommends) fails at boot on a host without IPMI hardware: true masks it
pacemaker_openipmi_masked: false

# SBD watchdog fencing; false skips SBD (a cluster fenced by fence agents)
pacemaker_sbd: true
# false writes /etc/default/sbd and leaves sbd.service disabled (a container, or a host without a watchdog yet)
pacemaker_sbd_service: true
# The watchdog SBD opens: a character device no other process holds
pacemaker_sbd_watchdog_device: /dev/watchdog
# Seconds: a node that stops feeding the watchdog resets after this
pacemaker_sbd_watchdog_timeout: 5
# Allow the role to restart the cluster stack (corosync, pacemaker, sbd) on every node, one at a time, when SBD is new
# or changed: resources on a node stop while it restarts. false refuses before any change instead
pacemaker_allow_restart: false
# Shared block devices; [] is diskless SBD (watchdog only, needs quorum: three votes or a quorum device)
pacemaker_sbd_devices: []
# Other /etc/default/sbd settings, e.g. {SBD_STARTMODE: clean}
pacemaker_sbd_options: {}

# crm_config properties, set once from one node, e.g. {stonith-watchdog-timeout: 10, no-quorum-policy: stop};
# a null value deletes the property
pacemaker_cluster_properties: {}
# rsc_defaults and op_defaults, the same way
pacemaker_resource_defaults: {}
pacemaker_op_defaults: {}

# A node whose stack failed to start (sbd timed out at boot with no corosync yet, e.g. the network still down)
# retries it on a timer: only a failed sbd, corosync or pacemaker counts, never a clean stop
pacemaker_rejoin: false
# Seconds between retries
pacemaker_rejoin_interval: 60
# Units started on a retry: the stack comes up through pacemaker's dependencies; add e.g. corosync-qdevice.service
pacemaker_rejoin_units:
  - pacemaker.service

# Seconds to wait for a node to rejoin after a stack restart, and for every node to be online
pacemaker_join_timeout: 120
