---
# Tasks: a rerun of converge from the control node; molecule_args extra arguments, molecule_expect ok|fail;
# registers molecule_run (stdout holds the recap).
- name: Run the role again
  ansible.builtin.command:
    argv: "{{ [playbook_dir ~ '/../../shared/run.sh'] + molecule_args }}"
  register: molecule_run
  # molecule_label names the case in the output
  environment:
    MOLECULE_CASE: "{{ molecule_label }}"
  changed_when: false
  failed_when: (molecule_run.rc == 0) != (molecule_expect == 'ok')
  delegate_to: localhost
  run_once: true
