---
- name: Verify
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Every node online with quorum
      ansible.builtin.include_tasks: ../../shared/online.yml

    - name: The properties unchanged by every failed run, SBD configuration unchanged
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          fail() { echo "FAIL: $*"; exit 1; }
          [ "$(crm_attribute --type crm_config --name no-quorum-policy --query --quiet)" = stop ] || fail "no-quorum-policy changed"
          grep -qx 'SBD_WATCHDOG_TIMEOUT=15' /etc/default/sbd || fail "/etc/default/sbd changed"
          [ "$(systemctl is-active sbd.service)" != active ] || fail "sbd started"
      args:
        executable: /bin/bash
      changed_when: false
