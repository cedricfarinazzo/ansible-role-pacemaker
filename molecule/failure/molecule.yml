---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml" -p "$MOLECULE_SCENARIO_DIRECTORY/../shared/roles"'
driver:
  name: docker
# Two nodes with two_node quorum: the failure paths on a built cluster
platforms:
  - name: pacemaker-a-failure-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-a
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-failure-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
  - name: pacemaker-b-failure-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-b
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-failure-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      nodes:
        molecule_nodeid: "{{ groups['nodes'].index(inventory_hostname) + 1 }}"
        corosync_cluster_name: molecule
        corosync_two_node: true
        corosync_nodes: >-
          {{ groups['nodes'] | map('extract', hostvars) | map(attribute='molecule_node') | list }}
        molecule_node:
          name: "{{ inventory_hostname.split('-')[:2] | join('-') }}"
          host: "{{ inventory_hostname }}"
          nodeid: "{{ molecule_nodeid | int }}"
          addrs:
            - "{{ ansible_facts.default_ipv4.address }}"
        pacemaker_sbd_service: false
        pacemaker_sbd_watchdog_device: /dev/molecule-watchdog
        pacemaker_sbd_watchdog_timeout: 15
        pacemaker_sbd_options:
          SBD_STARTMODE: clean
        pacemaker_cluster_properties:
          no-quorum-policy: stop
          cluster-recheck-interval: 5min
          stonith-enabled: false
        pacemaker_resource_defaults:
          resource-stickiness: 100
        pacemaker_op_defaults:
          timeout: 60s
verifier:
  name: ansible
scenario:
  name: failure
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - verify
    - side_effect
    - destroy
