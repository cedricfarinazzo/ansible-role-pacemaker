---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml" -p "$MOLECULE_SCENARIO_DIRECTORY/../shared/roles"'
driver:
  name: docker
# Two nodes, no SBD: pacemaker.service ordering drop-ins and the DRBD wait, changed, dropped, removed
platforms:
  - name: pacemaker-a-systemd-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-a
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-systemd-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
  - name: pacemaker-b-systemd-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-b
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-systemd-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    cleanup: ../shared/cleanup.yml
    destroy: ../shared/destroy.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      nodes:
        molecule_nodeid: "{{ groups['nodes'].index(inventory_hostname) + 1 }}"
        corosync_cluster_name: molecule
        corosync_two_node: true
        corosync_nodes: >-
          {{ groups['nodes'] | map('extract', hostvars) | map(attribute='molecule_node') | list }}
        molecule_node:
          name: "{{ inventory_hostname.split('-')[:2] | join('-') }}"
          host: "{{ inventory_hostname }}"
          nodeid: "{{ molecule_nodeid | int }}"
          addrs:
            - "{{ ansible_facts.default_ipv4.address }}"
        pacemaker_sbd: false
        pacemaker_cluster_properties:
          stonith-enabled: false
          no-quorum-policy: ignore
        # Same stem, two units: two drop-ins
        pacemaker_systemd_after:
          - molecule-monitor.service
          - molecule-monitor.socket
        pacemaker_systemd_wants:
          - molecule-want.service
        pacemaker_systemd_requires:
          - molecule-need.service
        pacemaker_drbd_wait_resources:
          - r0
          - r1
          - r2
        pacemaker_drbd_wait_timeout: 4
        pacemaker_drbd_wait_after:
          - molecule-drbd.service
        pacemaker_drbd_wait_resource_dir: /etc/molecule-drbd
verifier:
  name: ansible
scenario:
  name: systemd
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - side_effect
    - cleanup
    - destroy
