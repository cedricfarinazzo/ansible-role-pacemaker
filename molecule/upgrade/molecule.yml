---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml" -p "$MOLECULE_SCENARIO_DIRECTORY/../shared/roles"'
driver:
  name: docker
# Three nodes, each with a local apt repository holding newer versions of two stand-in packages
platforms:
  - name: pacemaker-a-upgrade-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-a
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-upgrade-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
  - name: pacemaker-b-upgrade-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-b
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-upgrade-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
  - name: pacemaker-c-upgrade-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-c
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-upgrade-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    cleanup: ../shared/cleanup.yml
    destroy: ../shared/destroy.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      nodes:
        molecule_nodeid: "{{ groups['nodes'].index(inventory_hostname) + 1 }}"
        corosync_cluster_name: molecule
        corosync_nodes: >-
          {{ groups['nodes'] | map('extract', hostvars) | map(attribute='molecule_node') | list }}
        molecule_node:
          name: "{{ inventory_hostname.split('-')[:2] | join('-') }}"
          host: "{{ inventory_hostname }}"
          nodeid: "{{ molecule_nodeid | int }}"
          addrs:
            - "{{ ansible_facts.default_ipv4.address }}"
        pacemaker_openipmi_masked: true
        pacemaker_sbd_service: false
        pacemaker_sbd_watchdog_device: /dev/molecule-watchdog
        pacemaker_sbd_watchdog_timeout: 15
        pacemaker_sbd_options:
          SBD_STARTMODE: clean
        pacemaker_cluster_properties:
          no-quorum-policy: stop
          cluster-recheck-interval: 5min
          stonith-enabled: false
        pacemaker_resource_defaults:
          resource-stickiness: 100
        pacemaker_op_defaults:
          timeout: 60s
        # Prefers the first node, sticks nowhere: it leaves that node in standby and comes back after
        pacemaker_primitives:
          - id: molecule-moving
            class: ocf
            provider: pacemaker
            type: Dummy
            meta_attributes:
              resource-stickiness: 0
            operations:
              - name: monitor
                interval: 10s
                timeout: 60s
              - name: start
                interval: 0s
                timeout: 90s
              - name: stop
                interval: 0s
                timeout: 90s
        pacemaker_location_constraints:
          - id: molecule-moving-prefers-a
            resource: molecule-moving
            node: pacemaker-a
            score: 100
        pacemaker_upgrade_patterns:
          - molecule-cluster-
        pacemaker_upgrade_poll_delay: 1
        pacemaker_upgrade_timeout: 120
verifier:
  name: ansible
scenario:
  name: upgrade
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - side_effect
    - cleanup
    - destroy
