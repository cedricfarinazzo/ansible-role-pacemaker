---
- name: Verify
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Every node online with quorum
      ansible.builtin.include_tasks: ../../shared/online.yml

    - name: The CIB matches the inputs
      ansible.builtin.include_tasks: ../../shared/cib.yml

    - name: Each primitive where its locations put it
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          fail() { echo "FAIL: $*"; exit 1; }
          where() { crm_mon -1 | sed -n "s/^ *\* $1[[:space:]].*Started \(pacemaker-[a-z]\).*/\1/p"; }
          for i in $(seq 30); do [ "$(where molecule-bare)" = pacemaker-c ] && [ "$(where molecule-two)" = pacemaker-c ] && break; sleep 2; done
          [ "$(where molecule-one)" = pacemaker-a ] || fail "one: $(crm_mon -1)"
          [ "$(where molecule-two)" = pacemaker-c ] || fail "two: $(crm_mon -1)"
          [ "$(where molecule-bare)" = pacemaker-c ] || fail "bare: $(crm_mon -1)"
      args:
        executable: /bin/bash
      changed_when: false
