---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy install -r "$MOLECULE_SCENARIO_DIRECTORY/../shared/collections.yml" -p "$MOLECULE_SCENARIO_DIRECTORY/../shared/roles"'
driver:
  name: docker
# Three nodes: several primitives, one with no attribute nor operation, and every kind of location score
platforms:
  - name: pacemaker-a-resources-multi-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-a
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-resources-multi-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
  - name: pacemaker-b-resources-multi-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-b
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-resources-multi-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
  - name: pacemaker-c-resources-multi-${MOLECULE_DISTRO:-debian13}
    hostname: pacemaker-c
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    # libqb IPC of corosync and pacemaker lives in /dev/shm: Docker's 64 MB fills up
    shm_size: 512m
    pre_build_image: true
    networks:
      - name: pacemaker-resources-multi-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    cleanup: ../shared/cleanup.yml
    destroy: ../shared/destroy.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      nodes:
        molecule_nodeid: "{{ groups['nodes'].index(inventory_hostname) + 1 }}"
        corosync_cluster_name: molecule
        corosync_nodes: >-
          {{ groups['nodes'] | map('extract', hostvars) | map(attribute='molecule_node') | list }}
        molecule_node:
          name: "{{ inventory_hostname.split('-')[:2] | join('-') }}"
          host: "{{ inventory_hostname }}"
          nodeid: "{{ molecule_nodeid | int }}"
          addrs:
            - "{{ ansible_facts.default_ipv4.address }}"
        pacemaker_openipmi_masked: true
        pacemaker_sbd_service: false
        pacemaker_sbd_watchdog_device: /dev/molecule-watchdog
        pacemaker_sbd_watchdog_timeout: 15
        pacemaker_sbd_options:
          SBD_STARTMODE: clean
        pacemaker_cluster_properties:
          no-quorum-policy: stop
          cluster-recheck-interval: 5min
          stonith-enabled: false
        pacemaker_resource_defaults:
          resource-stickiness: 100
        pacemaker_op_defaults:
          timeout: 60s
        pacemaker_primitives:
          - id: molecule-one
            class: ocf
            provider: pacemaker
            type: Dummy
            instance_attributes:
              fake: one
            operations:
              - name: monitor
                interval: 10s
                timeout: 20s
          - id: molecule-two
            class: ocf
            provider: pacemaker
            type: Dummy
            meta_attributes:
              target-role: Started
              migration-threshold: 2
          # No attribute, no operation
          - id: molecule-bare
            class: ocf
            provider: pacemaker
            type: Dummy
        pacemaker_location_constraints:
          - id: molecule-one-on-a
            resource: molecule-one
            node: pacemaker-a
            score: INFINITY
          - id: molecule-two-not-a
            resource: molecule-two
            node: pacemaker-a
            score: -INFINITY
          - id: molecule-two-prefers-c
            resource: molecule-two
            node: pacemaker-c
            score: 500
          - id: molecule-bare-not-b
            resource: molecule-bare
            node: pacemaker-b
            score: -INFINITY
          - id: molecule-bare-on-c
            resource: molecule-bare
            node: pacemaker-c
            score: INFINITY
verifier:
  name: ansible
scenario:
  name: resources-multi
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - verify
    - idempotence
    - side_effect
    - cleanup
    - destroy
