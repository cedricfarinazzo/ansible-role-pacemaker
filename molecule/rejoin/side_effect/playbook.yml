---
# A boot with the network down, as on a host: corosync waits for a stand-in of network-online (ping a peer), sbd's
# start times out first (its cluster servant needs a running corosync), corosync and pacemaker fail as dependency.
# Then the network comes back. Without the rejoin timer the node stays out; with it the stack starts by itself.
- name: An isolated boot
  hosts: nodes
  gather_facts: true
  vars:
    molecule_first: "{{ groups['nodes'][0] }}"
    molecule_peer: "{{ hostvars[groups['nodes'][1]].ansible_facts.default_ipv4.address }}"
  tasks:
    - name: Rerun with no change
      ansible.builtin.include_tasks: ../../shared/recap.yml
      vars:
        molecule_label: no change
        molecule_args: []
        molecule_expect: ok

    - name: Nothing changed
      ansible.builtin.assert:
        that: molecule_run.stdout | regex_findall('changed=0 ') | length == groups['nodes'] | length
        fail_msg: "{{ molecule_run.stdout_lines[-6:] }}"
      run_once: true

    - name: Test-only units, the first node
      when: inventory_hostname == molecule_first
      block:
        # Test-only, never the role's: a host's network-online waits for links; sbd's start timeout made short
        - name: A stand-in network-online that waits for a peer
          ansible.builtin.copy:
            dest: /etc/systemd/system/molecule-wait-online.service
            mode: "0644"
            content: |
              [Unit]
              Description=Molecule stand-in for network-online
              [Service]
              Type=oneshot
              TimeoutStartSec=infinity
              ExecStart=/bin/sh -c 'until ping -c1 -W1 {{ molecule_peer }} >/dev/null; do sleep 1; done'

        - name: Drop-in directories
          ansible.builtin.file:
            path: "/etc/systemd/system/{{ item }}.service.d"
            state: directory
            mode: "0755"
          loop:
            - corosync
            - sbd

        - name: Corosync waits for it, sbd times out sooner
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item.unit }}.service.d/molecule.conf"
            mode: "0644"
            content: "{{ item.content }}"
          loop:
            - unit: corosync
              content: "[Unit]\nWants=molecule-wait-online.service\nAfter=molecule-wait-online.service\n"
            - unit: sbd
              content: "[Service]\nTimeoutStartSec=20\n"
          loop_control:
            label: "{{ item.unit }}"

        - name: Systemd reads them
          ansible.builtin.systemd_service:
            daemon_reload: true

    - name: The rejoin timer off
      ansible.builtin.include_tasks: ../../shared/recap.yml
      vars:
        molecule_label: rejoin off
        molecule_args:
          - -e
          - '{"pacemaker_rejoin": false}'
        molecule_expect: ok

    - name: The timer and its units are gone
      ansible.builtin.shell:
        cmd: |
          [ ! -e /etc/systemd/system/pacemaker-rejoin.timer ] || { echo "FAIL: timer file"; exit 1; }
          [ ! -e /etc/systemd/system/pacemaker-rejoin.service ] || { echo "FAIL: service file"; exit 1; }
          ! systemctl is-active -q pacemaker-rejoin.timer || { echo "FAIL: timer active"; exit 1; }
      changed_when: false

    - name: Isolated boot without the timer
      ansible.builtin.include_tasks: isolated_boot.yml
      vars:
        molecule_expect_rejoin: false
      when: inventory_hostname == molecule_first

    - name: Manual recovery  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl start pacemaker.service
      changed_when: true
      when: inventory_hostname == molecule_first

    - name: Every node online again
      ansible.builtin.include_tasks: ../../shared/online.yml

    - name: The rejoin timer on
      ansible.builtin.include_tasks: ../../shared/recap.yml
      vars:
        molecule_label: rejoin on
        molecule_args: []
        molecule_expect: ok

    - name: Isolated boot with the timer
      ansible.builtin.include_tasks: isolated_boot.yml
      vars:
        molecule_expect_rejoin: true
      when: inventory_hostname == molecule_first

    - name: Every node online, no manual command
      ansible.builtin.include_tasks: ../../shared/online.yml

    - name: A clean stop is not undone
      when: inventory_hostname == molecule_first
      block:
        - name: Stop the stack cleanly  # noqa: command-instead-of-module
          ansible.builtin.command: systemctl stop corosync.service
          changed_when: true

        - name: Corosync stays stopped over three timer periods
          ansible.builtin.shell:
            cmd: |
              sleep 35
              ! systemctl is-active -q corosync.service || { echo "FAIL: a clean stop was undone"; exit 1; }
          changed_when: false

        - name: Start it again  # noqa: command-instead-of-module
          ansible.builtin.command: systemctl start pacemaker.service
          changed_when: true

    - name: Every node online at the end
      ansible.builtin.include_tasks: ../../shared/online.yml
