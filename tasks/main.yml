---
- name: Validate inputs
  ansible.builtin.import_tasks: validate.yml

- name: Pacemaker
  when: pacemaker_state == 'present'
  block:
    # Before any package: installing pacemaker would start corosync on a node where it is stopped
    - name: Corosync runs and is quorate on every node
      ansible.builtin.include_tasks: corosync.yml

    - name: A stack restart is allowed when SBD needs one
      ansible.builtin.include_tasks: restart_check.yml
      when: pacemaker_sbd and pacemaker_sbd_service

    - name: Packages
      ansible.builtin.include_tasks: install.yml

    # Before any stack (re)start below, so that start already runs with them
    - name: Systemd ordering and DRBD wait of pacemaker.service
      ansible.builtin.include_tasks: systemd.yml

    - name: SBD
      ansible.builtin.include_tasks: sbd.yml
      when: pacemaker_sbd

    - name: SBD off
      ansible.builtin.include_tasks: sbd_off.yml
      when: not pacemaker_sbd

    - name: Pacemaker service and membership
      ansible.builtin.include_tasks: service.yml

    - name: Rejoin after a failed start
      ansible.builtin.include_tasks: rejoin.yml

    - name: Cluster properties and defaults
      ansible.builtin.include_tasks: properties.yml

    - name: Primitives and location constraints
      ansible.builtin.include_tasks: resources.yml
      when:
        - __pacemaker_started is not skipped
        - pacemaker_primitives | length > 0 or pacemaker_location_constraints | length > 0

- name: Remove Pacemaker
  ansible.builtin.include_tasks: absent.yml
  when: pacemaker_state == 'absent'
