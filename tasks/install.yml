---
- name: Packages are installed
  ansible.builtin.apt:
    name: "{{ pacemaker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# pcsd rewrites corosync.conf and listens on TCP 2224, pcsd-ruby is its backend; the pcs CLI stays for "pcs status".
# systemctl, not the module: the module refuses to mask an absent unit. creates: check mode reports a pending mask
- name: Mask pcsd and its Ruby backend  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl mask --now {{ item }}
  args:
    creates: /etc/systemd/system/{{ item }}
  loop: "{{ __pacemaker_pcsd_units }}"
  when: pacemaker_pcsd_masked

# A unit that already failed stays listed as failed until reset; no IPMI device means nothing to lose
- name: Mask openipmi  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: systemctl mask --now openipmi.service && { systemctl reset-failed openipmi.service 2>/dev/null || true; }
    creates: /etc/systemd/system/openipmi.service
  when: pacemaker_openipmi_masked
