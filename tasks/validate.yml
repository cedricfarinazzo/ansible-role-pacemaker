---
# Every input checked before any change. Every regex ends in \Z (a $ lets a trailing newline through) and its
# classes hold no control character: a value reaches /etc/default/sbd or a crm_attribute argument.
- name: Settings are sound
  ansible.builtin.assert:
    that:
      - pacemaker_state in ['present', 'absent']
      - pacemaker_packages_extra is sequence and pacemaker_packages_extra is not string
      - pacemaker_packages_extra is not mapping
      - pacemaker_packages_extra | map('string') | reject('match', '^[a-z0-9][a-z0-9.+-]+\Z') | list | length == 0
      - pacemaker_pcsd_masked is boolean and pacemaker_openipmi_masked is boolean
      - pacemaker_sbd is boolean and pacemaker_sbd_service is boolean and pacemaker_allow_restart is boolean
      - pacemaker_join_timeout | string is match('^[1-9][0-9]{0,4}\Z')
      - pacemaker_rejoin is boolean
      - pacemaker_rejoin_interval | string is match('^([5-9]|[1-9][0-9]{1,4})\Z')
      - pacemaker_rejoin_units is sequence and pacemaker_rejoin_units is not string and pacemaker_rejoin_units is not mapping
      - pacemaker_rejoin_units | length > 0
      - pacemaker_rejoin_units | map('string') | reject('match', '^[A-Za-z0-9][A-Za-z0-9@_.:-]{0,250}\.(service|target)\Z') | list | length == 0
      - pacemaker_rejoin_log_level_max is string
      - pacemaker_rejoin_log_level_max is match('^(emerg|alert|crit|err|warning|notice|info|debug|[0-7])?\Z')
    fail_msg: >-
      pacemaker_state present|absent; pacemaker_packages_extra a list of package names; pacemaker_pcsd_masked,
      pacemaker_openipmi_masked, pacemaker_sbd, pacemaker_sbd_service, pacemaker_allow_restart, pacemaker_rejoin booleans;
      pacemaker_join_timeout seconds, 1-99999; pacemaker_rejoin_interval seconds, 5-99999 (under 5 the oneshot
      service hits systemd's start limit, 5 starts in 10 s); pacemaker_rejoin_units a non-empty list of
      .service or .target names; pacemaker_rejoin_log_level_max empty or a syslog level (emerg..debug, 0-7)
    quiet: true

- name: SBD settings are sound
  ansible.builtin.assert:
    that:
      - pacemaker_sbd_watchdog_device is string and pacemaker_sbd_watchdog_device is match('^/[A-Za-z0-9._/-]+\Z')
      - pacemaker_sbd_watchdog_timeout | string is match('^[1-9][0-9]{0,3}\Z')
      - pacemaker_sbd_devices is sequence and pacemaker_sbd_devices is not string and pacemaker_sbd_devices is not mapping
      - pacemaker_sbd_devices | length <= 3
      - pacemaker_sbd_devices | map('string') | reject('match', '^/[A-Za-z0-9._:/-]+\Z') | list | length == 0
      - pacemaker_sbd_options is mapping
      - pacemaker_sbd_options.keys() | map('string') | reject('match', '^SBD_[A-Z0-9_]+\Z') | list | length == 0
      # Owned by the inputs above
      - pacemaker_sbd_options.keys() | intersect(['SBD_WATCHDOG_DEV', 'SBD_WATCHDOG_TIMEOUT', 'SBD_DEVICE']) | length == 0
      - pacemaker_sbd_options.values() | map('string') | reject('match', '^[ -~]{0,255}\Z') | list | length == 0
      - pacemaker_sbd_options.values() | map('string') | select('search', '["\\\\`$]') | list | length == 0
    fail_msg: >-
      pacemaker_sbd_watchdog_device an absolute path; pacemaker_sbd_watchdog_timeout seconds, 1-9999;
      pacemaker_sbd_devices up to 3 absolute paths; pacemaker_sbd_options a map of SBD_* names (not SBD_WATCHDOG_DEV,
      SBD_WATCHDOG_TIMEOUT or SBD_DEVICE) to printable values without quotes, backslashes, backticks or $
    quiet: true
  when: pacemaker_state == 'present' and pacemaker_sbd

- name: CIB values are sound
  ansible.builtin.assert:
    that:
      - item.settings is mapping
      - item.settings.keys() | map('string') | reject('match', '^[A-Za-z][A-Za-z0-9_-]{0,63}\Z') | list | length == 0
      - item.settings.values() | reject('none') | map('string') | reject('match', '^[ -~]{1,255}\Z') | list | length == 0
    fail_msg: >-
      pacemaker_cluster_properties, pacemaker_resource_defaults and pacemaker_op_defaults: maps of names
      ([A-Za-z][A-Za-z0-9_-]*) to printable values of 1-255 characters, or null to delete ({{ item.type }})
    quiet: true
  loop: "{{ pacemaker_cib_sets }}"
  loop_control:
    label: "{{ item.type }}"
  when: pacemaker_state == 'present'

# Pacemaker's controller exits when stonith-watchdog-timeout is set and SBD does not run
- name: A watchdog timeout needs SBD running
  ansible.builtin.assert:
    that: >-
      pacemaker_cluster_properties['stonith-watchdog-timeout'] | default(none) is none
      or pacemaker_cluster_properties['stonith-watchdog-timeout'] | string in ['0', '0s']
      or (pacemaker_sbd and pacemaker_sbd_service and pacemaker_sbd_devices | length == 0)
    fail_msg: >-
      stonith-watchdog-timeout is for diskless SBD: it needs pacemaker_sbd and pacemaker_sbd_service true and no
      pacemaker_sbd_devices; Pacemaker's controller exits when it is set and SBD does not run
    quiet: true
  when: pacemaker_state == 'present'

# Pacemaker: stonith-watchdog-timeout at least twice SBD_WATCHDOG_TIMEOUT (-1 lets Pacemaker take twice), and
# stonith-timeout, set explicitly (its default of 60 s may be shorter), longer than it; both in seconds
- name: Watchdog fencing timeouts fit the SBD watchdog timeout
  ansible.builtin.assert:
    that:
      - __pacemaker_swt is match('^(-1|[1-9][0-9]*s?)\Z')
      - __pacemaker_st is match('^[1-9][0-9]*s?\Z')
      - __pacemaker_swt_s | int >= 2 * (pacemaker_sbd_watchdog_timeout | int)
      - __pacemaker_st | regex_replace('s\Z', '') | int > __pacemaker_swt_s | int
    fail_msg: >-
      stonith-watchdog-timeout ({{ __pacemaker_swt }}) must be seconds (or -1) and at least twice
      pacemaker_sbd_watchdog_timeout ({{ pacemaker_sbd_watchdog_timeout }}); stonith-timeout
      ({{ __pacemaker_st | default('unset', true) }}) must be set, in seconds, and longer than it
    quiet: true
  vars:
    __pacemaker_swt: "{{ pacemaker_cluster_properties['stonith-watchdog-timeout'] | default('0', true) | string }}"
    __pacemaker_st: "{{ pacemaker_cluster_properties['stonith-timeout'] | default('', true) | string }}"
    __pacemaker_swt_s: "{{ (2 * (pacemaker_sbd_watchdog_timeout | int)) if __pacemaker_swt == '-1' else (__pacemaker_swt | regex_replace('s\\Z', '')) }}"
  when:
    - pacemaker_state == 'present'
    - pacemaker_sbd
    - __pacemaker_swt not in ['0', '0s']

# A value lands in an XML attribute: no quote, < > or &, so the role writes it unescaped
- name: Primitives are sound
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.id | default('') | string is match('^[A-Za-z][A-Za-z0-9_.-]{0,63}\Z')
      - item.class | default('') in ['ocf', 'systemd', 'lsb', 'service']
      - (item.provider | default('') | string is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}\Z')) == (item.class | default('') == 'ocf')
      - item.type | default('') | string is match('^[A-Za-z0-9][A-Za-z0-9_.@-]{0,127}\Z')
      - item.state | default('present') in ['present', 'absent']
      # A misspelt or unsupported key (group, clone, on-fail) is refused, never silently dropped
      - item.keys() | list | difference(['id', 'class', 'provider', 'type', 'instance_attributes', 'meta_attributes', 'operations', 'state']) | length == 0
      - item.instance_attributes | default({}) is mapping and item.meta_attributes | default({}) is mapping
      - ((item.instance_attributes | default({})).keys() | list + (item.meta_attributes | default({})).keys() | list)
        | map('string') | reject('match', '^[A-Za-z][A-Za-z0-9_.-]{0,63}\Z') | list | length == 0
      - ((item.instance_attributes | default({})).values() | list + (item.meta_attributes | default({})).values() | list)
        | select('none') | list | length == 0
      - ((item.instance_attributes | default({})).values() | list + (item.meta_attributes | default({})).values() | list)
        | map('string') | reject('match', '^[ !#-%(-;=?-~]{1,255}\Z') | list | length == 0
      - item.operations | default([]) is sequence and item.operations | default([]) is not string
      - item.operations | default([]) is not mapping
      - item.operations | default([]) | reject('mapping') | list | length == 0
      - item.operations | default([]) | map('list') | flatten | difference(['name', 'interval', 'timeout', 'on_fail']) | length == 0
      - item.operations | default([]) | map(attribute='on_fail', default='restart') | map('string')
        | reject('in', ['ignore', 'block', 'stop', 'restart', 'fence', 'standby', 'ask', 'demote', 'restart-container']) | list | length == 0
      - item.operations | default([]) | map(attribute='name', default='') | map('string')
        | reject('match', '^[a-z][a-z_-]{0,31}\Z') | list | length == 0
      - item.operations | default([]) | map(attribute='interval', default='0') | map('string')
        | reject('match', '^[0-9]{1,6}(ms|s|m|min|h)?\Z') | list | length == 0
      - item.operations | default([]) | map(attribute='timeout', default='') | map('string')
        | reject('match', '^[1-9][0-9]{0,5}(ms|s|m|min|h)?\Z') | list | length == 0
      # The operation id is <id>-<name>-interval-<interval>: one operation per name and interval
      - __pacemaker_op_keys | unique | length == __pacemaker_op_keys | length
    fail_msg: >-
      pacemaker_primitives ({{ item.id | default('?') | string | truncate(40) }}): id [A-Za-z][A-Za-z0-9_.-]*; class ocf,
      systemd, lsb or service; provider for ocf only; type an agent name; instance_attributes and meta_attributes maps of
      names to printable values without quotes, <, > or &; operations a list of {name, interval, timeout, on_fail} (e.g. monitor,
      10s, 20s), one per name and interval; no other key; state present|absent
    quiet: true
  vars:
    __pacemaker_op_keys: >-
      {{ (item.operations | default([]) if item is mapping and item.operations | default([]) is sequence else [])
         | map(attribute='name', default='') | zip((item.operations | default([]) if item is mapping
         and item.operations | default([]) is sequence else []) | map(attribute='interval', default='0'))
         | map('join', '/') | list }}
  loop: "{{ pacemaker_primitives if pacemaker_primitives is sequence and pacemaker_primitives is not string and pacemaker_primitives is not mapping else [none] }}"
  loop_control:
    label: "{{ item.id | default('?') if item is mapping else item }}"
  when: pacemaker_state == 'present'

- name: Location constraints are sound
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.id | default('') | string is match('^[A-Za-z][A-Za-z0-9_.-]{0,63}\Z')
      - item.resource | default('') | string is match('^[A-Za-z][A-Za-z0-9_.-]{0,63}\Z')
      - item.node | default('') | string is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,252}\Z')
      - item.score | default('') | string is match('^([+-]?INFINITY|-?(0|[1-9][0-9]{0,8}))\Z')
      - item.state | default('present') in ['present', 'absent']
      - item.keys() | list | difference(['id', 'resource', 'node', 'score', 'state']) | length == 0
      # A constraint kept on a primitive this run removes would be left dangling
      - >-
        item.state | default('present') == 'absent' or item.resource | default('') not in
        (pacemaker_primitives | selectattr('state', 'defined') | selectattr('state', '==', 'absent') | map(attribute='id') | list)
    fail_msg: >-
      pacemaker_location_constraints ({{ item.id | default('?') | string | truncate(40) }}): id and resource
      [A-Za-z][A-Za-z0-9_.-]*; node a node name; score INFINITY, -INFINITY or an integer; state present|absent; no other key; a present
      constraint cannot name a primitive set absent
    quiet: true
  loop: >-
    {{ pacemaker_location_constraints if pacemaker_location_constraints is sequence
       and pacemaker_location_constraints is not string and pacemaker_location_constraints is not mapping else [none] }}
  loop_control:
    label: "{{ item.id | default('?') if item is mapping else item }}"
  when: pacemaker_state == 'present'

- name: Resource ids are unique
  ansible.builtin.assert:
    that:
      - (pacemaker_primitives | map(attribute='id') | list + pacemaker_location_constraints | map(attribute='id') | list)
        | unique | length == pacemaker_primitives | length + pacemaker_location_constraints | length
    fail_msg: pacemaker_primitives and pacemaker_location_constraints ids must be unique across both lists
    quiet: true
  when: pacemaker_state == 'present'
